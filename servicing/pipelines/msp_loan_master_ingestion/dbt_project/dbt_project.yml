# PULSE-managed (ADR 0026/0027): GCP dbt runtime project skeleton, emitted as a package
# artifact so the staged gs://<filesBucket>/<namespace>/dbt_project/ is a self-contained,
# per-pipeline dbt project the GCP DAG dbt task fetches + runs (issue-5 Wave-A15, Blocker E:
# per-pipeline namespacing). dbt-bigquery + BigQuery-managed Iceberg (catalogs.yml).
name: 'home_lending'
version: '0.1.0'
config-version: 2
profile: 'home_lending'
require-dbt-version: ">=1.10.0,<2.0.0"
model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
packages-install-path: dbt_vendor
clean-targets:
  - target
  - dbt_packages
  - dbt_vendor

quoting:
  database: true
  schema: false
  identifier: false

models:
  home_lending:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: table
      +tags: ['staging', 'silver']
    intermediate:
      +materialized: table
      +tags: ['intermediate', 'silver']
    marts:
      +materialized: table
      +tags: ['marts', 'gold']

snapshots:
  home_lending:
    +target_schema: snapshots
